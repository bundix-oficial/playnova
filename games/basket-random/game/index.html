<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Basket Random</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body, html { width: 100%; height: 100%; overflow: hidden; background: #0f172a; font-family: 'Trebuchet MS', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  #canvas-container { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }

  /* Scoreboard */
  #scoreboard {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 16px;
    background: rgba(15, 23, 42, 0.85);
    border: 3px solid #334155;
    padding: 8px 24px;
    border-radius: 30px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.6);
    pointer-events: none;
    font-weight: 900;
  }
  .score-p1 { color: #3b82f6; font-size: 32px; min-width: 36px; text-align: center; }
  .score-sep { color: #94a3b8; font-size: 20px; }
  .score-p2 { color: #ef4444; font-size: 32px; min-width: 36px; text-align: center; }

  /* Mode Selector */
  #mode-selector {
    position: absolute;
    top: 14px;
    right: 18px;
    display: flex;
    gap: 8px;
    z-index: 20;
  }
  .mode-btn {
    background: #1e293b;
    border: 2px solid #475569;
    color: #fff;
    padding: 6px 14px;
    border-radius: 16px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s;
  }
  .mode-btn.active {
    background: #3b82f6;
    border-color: #60a5fa;
  }

  /* Center Announcement */
  #center-banner {
    position: absolute;
    top: 36%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 48px;
    font-weight: 900;
    color: #facc15;
    text-shadow: 3px 3px 0 #000, 0 0 25px rgba(234, 179, 8, 0.8);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    text-transform: uppercase;
    letter-spacing: 2px;
    text-align: center;
  }

  /* Mobile Fullscreen Tap Zones */
  #touch-zones {
    position: absolute;
    inset: 0;
    display: none;
    pointer-events: auto;
  }
  .t-zone {
    width: 50%;
    height: 100%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 24px;
    color: rgba(255,255,255,0.4);
    font-size: 18px;
    font-weight: bold;
  }
  #zone-p1 { float: left; border-right: 2px dashed rgba(255,255,255,0.15); }
  #zone-p2 { float: right; }

  /* Win Modal */
  #win-modal {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(15, 23, 42, 0.95);
    border: 4px solid #facc15;
    border-radius: 20px;
    padding: 28px 44px;
    text-align: center;
    color: #fff;
    display: none;
    z-index: 50;
    box-shadow: 0 10px 50px rgba(0,0,0,0.8);
  }
  #win-modal h2 { font-size: 38px; color: #facc15; margin-bottom: 8px; }
  #win-modal p { font-size: 16px; color: #cbd5e1; margin-bottom: 20px; }
  #win-modal button {
    background: #3b82f6;
    color: #fff;
    border: none;
    font-size: 16px;
    font-weight: 900;
    padding: 12px 28px;
    border-radius: 24px;
    cursor: pointer;
  }

  /* Controls Hint */
  #controls-info {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.65);
    color: #cbd5e1;
    padding: 4px 16px;
    border-radius: 20px;
    font-size: 12px;
    pointer-events: none;
  }
  #controls-info kbd { background: #334155; padding: 2px 6px; border-radius: 4px; color: #fff; font-weight: bold; }
</style>
</head>
<body>

<div id="canvas-container">
  <canvas id="gameCanvas"></canvas>

  <div id="scoreboard">
    <span class="score-p1" id="score-1">0</span>
    <span class="score-sep">:</span>
    <span class="score-p2" id="score-2">0</span>
  </div>

  <div id="mode-selector">
    <button class="mode-btn active" id="btn-mode-cpu">1P vs CPU</button>
    <button class="mode-btn" id="btn-mode-2p">2 Jogadores</button>
  </div>

  <div id="center-banner">CESTA!</div>

  <div id="controls-info">
    <kbd>W</kbd>: Jogador 1 (Azul) · <kbd>▲ Seta Cima</kbd>: Jogador 2 / CPU (Vermelho)
  </div>

  <div id="touch-zones">
    <div class="t-zone" id="zone-p1">TOQUE: P1 (AZUL)</div>
    <div class="t-zone" id="zone-p2">TOQUE: P2 (VERMELHO)</div>
  </div>

  <div id="win-modal">
    <h2 id="win-title">TIME AZUL VENCEU!</h2>
    <p id="win-sub">Placar Final: 5 - 3</p>
    <button id="btn-restart">NOVA PARTIDA</button>
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  const GAME_WIDTH = 960;
  const GAME_HEIGHT = 540;

  function resize() {
    canvas.width = GAME_WIDTH;
    canvas.height = GAME_HEIGHT;
  }
  resize();

  if (('ontouchstart' in window) || navigator.maxTouchPoints > 0) {
    document.getElementById('touch-zones').style.display = 'block';
  }

  // Audio Engine
  const AudioEngine = {
    ctx: null,
    init() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) this.ctx = new AudioCtx();
      }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    playTone(freq, type, dur, vol = 0.2, slide = null) {
      if (!this.ctx) return;
      try {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        if (slide) osc.frequency.exponentialRampToValueAtTime(slide, this.ctx.currentTime + dur);
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + dur);
      } catch(e) {}
    },
    bounce() {
      this.init();
      this.playTone(180, 'sine', 0.08, 0.25, 120);
    },
    rim() {
      this.init();
      this.playTone(480, 'triangle', 0.12, 0.35, 320);
    },
    swish() {
      this.init();
      this.playTone(800, 'sine', 0.2, 0.4, 400);
      setTimeout(() => this.playTone(1000, 'triangle', 0.25, 0.3), 80);
    },
    jump() {
      this.init();
      this.playTone(260, 'sine', 0.1, 0.15, 380);
    },
    cheer() {
      this.init();
      const notes = [440, 554, 659, 880];
      notes.forEach((f, i) => setTimeout(() => this.playTone(f, 'sine', 0.2, 0.25), i * 90));
    }
  };

  // Input
  let p1Jump = false;
  let p2Jump = false;
  let vsCPU = true;

  window.addEventListener('keydown', e => {
    AudioEngine.init();
    if (e.key.toLowerCase() === 'w') p1Jump = true;
    if (e.key === 'ArrowUp') p2Jump = true;
  });
  window.addEventListener('keyup', e => {
    if (e.key.toLowerCase() === 'w') p1Jump = false;
    if (e.key === 'ArrowUp') p2Jump = false;
  });

  // Touch zones
  const z1 = document.getElementById('zone-p1');
  const z2 = document.getElementById('zone-p2');
  z1.addEventListener('touchstart', e => { e.preventDefault(); AudioEngine.init(); p1Jump = true; });
  z1.addEventListener('touchend', e => { e.preventDefault(); p1Jump = false; });
  z2.addEventListener('touchstart', e => { e.preventDefault(); AudioEngine.init(); p2Jump = true; });
  z2.addEventListener('touchend', e => { e.preventDefault(); p2Jump = false; });

  // Mode buttons
  document.getElementById('btn-mode-cpu').addEventListener('click', () => {
    vsCPU = true;
    document.getElementById('btn-mode-cpu').classList.add('active');
    document.getElementById('btn-mode-2p').classList.remove('active');
  });
  document.getElementById('btn-mode-2p').addEventListener('click', () => {
    vsCPU = false;
    document.getElementById('btn-mode-2p').classList.add('active');
    document.getElementById('btn-mode-cpu').classList.remove('active');
  });

  // Center banner
  function showCenterBanner(txt) {
    const b = document.getElementById('center-banner');
    b.textContent = txt;
    b.style.opacity = '1';
    b.style.transform = 'translate(-50%, -50%) scale(1.15)';
    clearTimeout(b._timer);
    b._timer = setTimeout(() => {
      b.style.opacity = '0';
      b.style.transform = 'translate(-50%, -50%) scale(1)';
    }, 1400);
  }

  // Environments
  const COURTS = [
    { name: 'Ginasio Classico', floorColor: '#ca8a04', floorLine: '#eab308', bgGrad: ['#1e293b', '#0f172a'], friction: 0.88 },
    { name: 'Pista de Gelo', floorColor: '#38bdf8', floorLine: '#bae6fd', bgGrad: ['#0369a1', '#082f49'], friction: 0.98 },
    { name: 'Praia Tropical', floorColor: '#facc15', floorLine: '#fde047', bgGrad: ['#0284c7', '#0369a1'], friction: 0.82 },
    { name: 'Street Rooftop', floorColor: '#475569', floorLine: '#ef4444', bgGrad: ['#7c2d12', '#431407'], friction: 0.9 }
  ];

  // Ball Types
  const BALLS = [
    { name: 'Classica', radius: 14, color: '#ea580c', bounce: 0.78, mass: 1.0 },
    { name: 'Pesada de Ferro', radius: 13, color: '#64748b', bounce: 0.45, mass: 2.2 },
    { name: 'Super Bola Saltitante', radius: 16, color: '#ec4899', bounce: 0.95, mass: 0.8 },
    { name: 'Bola Gigante de Praia', radius: 24, color: '#eab308', bounce: 0.85, mass: 0.6 }
  ];

  let currentCourt = COURTS[0];
  let currentBallType = BALLS[0];
  let score1 = 0;
  let score2 = 0;
  let matchOver = false;

  // Ball
  const ball = {
    x: GAME_WIDTH / 2,
    y: 180,
    vx: 0,
    vy: 0,
    rot: 0
  };

  // Basketball Hoops
  const hoopLeft = { x: 90, y: 260, r: 24, backboardX: 60, backboardY: 190, backboardH: 100 };
  const hoopRight = { x: GAME_WIDTH - 90, y: 260, r: 24, backboardX: GAME_WIDTH - 60, backboardY: 190, backboardH: 100 };

  // Ragdoll Player Class
  class Ragdoll {
    constructor(x, team, isForward) {
      this.team = team; // 1: Blue, 2: Red
      this.isForward = isForward;
      this.baseX = x;
      this.x = x;
      this.y = 440;
      this.vx = 0;
      this.vy = 0;
      this.angle = 0;
      this.armAngle = 0;
      this.onGround = true;
      this.bodyH = 50;
      this.armLength = 26;
      this.color = team === 1 ? '#3b82f6' : '#ef4444';
      this.skin = team === 1 ? '#fed7aa' : '#fcd34d';
    }

    jump() {
      if (this.onGround) {
        this.vy = -12.5;
        this.vx = (this.team === 1 ? 1 : -1) * (2.5 + Math.random() * 2);
        this.angle = (this.team === 1 ? -0.2 : 0.2);
        this.armAngle = -Math.PI / 2;
        this.onGround = false;
        AudioEngine.jump();
      }
    }

    update(floorFriction) {
      // Gravity
      this.vy += 0.55;
      this.x += this.vx;
      this.y += this.vy;

      // Arm swing back to rest
      this.armAngle += 0.08;
      if (this.armAngle > 0.4) this.armAngle = 0.4;

      // Angle upright stabilization
      this.angle *= 0.95;

      // Floor collision
      if (this.y >= 440) {
        this.y = 440;
        this.vy = 0;
        this.vx *= floorFriction;
        this.onGround = true;
        this.angle *= 0.8;
      }

      // Walls
      if (this.x < 110) { this.x = 110; this.vx = Math.abs(this.vx) * 0.5; }
      if (this.x > GAME_WIDTH - 110) { this.x = GAME_WIDTH - 110; this.vx = -Math.abs(this.vx) * 0.5; }

      // Hands position
      const shoulderX = this.x + Math.sin(this.angle) * 20;
      const shoulderY = this.y - this.bodyH + 18;
      const totalArmAng = this.angle + this.armAngle * (this.team === 1 ? 1 : -1);
      const handX = shoulderX + Math.cos(totalArmAng) * this.armLength * (this.team === 1 ? 1 : -1);
      const handY = shoulderY + Math.sin(totalArmAng) * this.armLength;

      // Check ball interaction with hand
      const distHand = Math.hypot(ball.x - handX, ball.y - handY);
      if (distHand < currentBallType.radius + 14) {
        const tossForceX = (this.team === 1 ? 1 : -1) * (7 + Math.random() * 4);
        const tossForceY = -8 - Math.random() * 4;
        ball.vx = tossForceX;
        ball.vy = tossForceY;
        AudioEngine.bounce();
      }

      // Check ball interaction with body / head
      const headY = this.y - this.bodyH - 10;
      const distHead = Math.hypot(ball.x - this.x, ball.y - headY);
      if (distHead < currentBallType.radius + 16) {
        ball.vx = (ball.x - this.x) * 0.4;
        ball.vy = -Math.abs(ball.vy) * 0.8 - 3;
        AudioEngine.bounce();
      }
    }

    draw() {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);

      // Legs
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(-6, 0); ctx.lineTo(-8, 18);
      ctx.moveTo(6, 0); ctx.lineTo(8, 18);
      ctx.stroke();

      // Torso / Jersey
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.roundRect(-12, -this.bodyH + 15, 24, this.bodyH - 15, 6);
      ctx.fill();

      // Jersey number
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(this.isForward ? '7' : '23', 0, -this.bodyH + 34);

      // Head
      ctx.fillStyle = this.skin;
      ctx.beginPath();
      ctx.arc(0, -this.bodyH - 2, 12, 0, Math.PI * 2);
      ctx.fill();

      // Headband
      ctx.fillStyle = this.color;
      ctx.fillRect(-12, -this.bodyH - 8, 24, 5);

      // Arm
      ctx.strokeStyle = this.skin;
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      const armAng = this.armAngle * (this.team === 1 ? 1 : -1);
      ctx.beginPath();
      ctx.moveTo(this.team === 1 ? 6 : -6, -this.bodyH + 18);
      ctx.lineTo((this.team === 1 ? 6 : -6) + Math.cos(armAng) * this.armLength * (this.team === 1 ? 1 : -1), -this.bodyH + 18 + Math.sin(armAng) * this.armLength);
      ctx.stroke();

      ctx.restore();
    }
  }

  // Create Players
  const players = [
    new Ragdoll(240, 1, false), // P1 Guard
    new Ragdoll(360, 1, true),  // P1 Forward
    new Ragdoll(GAME_WIDTH - 360, 2, true),  // P2 Forward
    new Ragdoll(GAME_WIDTH - 240, 2, false)  // P2 Guard
  ];

  // Reset for next round
  function resetRound() {
    // Randomize court & ball!
    currentCourt = COURTS[Math.floor(Math.random() * COURTS.length)];
    currentBallType = BALLS[Math.floor(Math.random() * BALLS.length)];

    ball.x = GAME_WIDTH / 2;
    ball.y = 140;
    ball.vx = (Math.random() - 0.5) * 4;
    ball.vy = -3;

    players[0].x = 240; players[0].y = 440; players[0].vx = 0; players[0].vy = 0; players[0].angle = 0;
    players[1].x = 360; players[1].y = 440; players[1].vx = 0; players[1].vy = 0; players[1].angle = 0;
    players[2].x = GAME_WIDTH - 360; players[2].y = 440; players[2].vx = 0; players[2].vy = 0; players[2].angle = 0;
    players[3].x = GAME_WIDTH - 240; players[3].y = 440; players[3].vx = 0; players[3].vy = 0; players[3].angle = 0;
  }

  function goalScored(team) {
    if (matchOver) return;

    AudioEngine.swish();
    AudioEngine.cheer();

    if (team === 1) {
      score1++;
      document.getElementById('score-1').textContent = score1;
      showCenterBanner('CESTA DO TIME AZUL! +1');
    } else {
      score2++;
      document.getElementById('score-2').textContent = score2;
      showCenterBanner('CESTA DO TIME VERMELHO! +1');
    }

    if (score1 >= 5 || score2 >= 5) {
      matchOver = true;
      const winner = score1 >= 5 ? 'TIME AZUL VENCEU!' : 'TIME VERMELHO VENCEU!';
      document.getElementById('win-title').textContent = winner;
      document.getElementById('win-sub').textContent = `Placar Final: ${score1} - ${score2}`;
      document.getElementById('win-modal').style.display = 'block';
    } else {
      setTimeout(resetRound, 1200);
    }
  }

  document.getElementById('btn-restart').addEventListener('click', () => {
    document.getElementById('win-modal').style.display = 'none';
    score1 = 0;
    score2 = 0;
    matchOver = false;
    document.getElementById('score-1').textContent = '0';
    document.getElementById('score-2').textContent = '0';
    resetRound();
  });

  // AI Logic for CPU Team 2
  let cpuTimer = 0;
  function updateCPU() {
    if (!vsCPU) return;

    cpuTimer++;
    // Jump when ball is near or coming toward hoop
    const pRed1 = players[2];
    const pRed2 = players[3];

    if (ball.x > GAME_WIDTH * 0.4 && ball.y < 380) {
      if (Math.random() < 0.05) {
        pRed1.jump();
      }
      if (Math.hypot(ball.x - pRed2.x, ball.y - pRed2.y) < 140 && Math.random() < 0.08) {
        pRed2.jump();
      }
    }
  }

  // Update
  function update() {
    if (matchOver) return;

    // Handle Jumps
    if (p1Jump) {
      players[0].jump();
      players[1].jump();
    }
    if (p2Jump && !vsCPU) {
      players[2].jump();
      players[3].jump();
    }

    updateCPU();

    // Update Players
    for (let p of players) {
      p.update(currentCourt.friction);
    }

    // Ball Physics
    ball.vy += 0.42 * currentBallType.mass;
    ball.x += ball.vx;
    ball.y += ball.vy;
    ball.rot += ball.vx * 0.05;

    // Floor bounce
    if (ball.y >= 450 - currentBallType.radius) {
      ball.y = 450 - currentBallType.radius;
      ball.vy = -ball.vy * currentBallType.bounce;
      ball.vx *= currentCourt.friction;
      if (Math.abs(ball.vy) > 1.5) AudioEngine.bounce();
    }

    // Walls
    if (ball.x <= currentBallType.radius) {
      ball.x = currentBallType.radius;
      ball.vx = -ball.vx * 0.8;
      AudioEngine.bounce();
    }
    if (ball.x >= GAME_WIDTH - currentBallType.radius) {
      ball.x = GAME_WIDTH - currentBallType.radius;
      ball.vx = -ball.vx * 0.8;
      AudioEngine.bounce();
    }

    // Backboards Collision
    // Left Backboard
    if (ball.x - currentBallType.radius < hoopLeft.backboardX + 10 && ball.x + currentBallType.radius > hoopLeft.backboardX &&
        ball.y > hoopLeft.backboardY && ball.y < hoopLeft.backboardY + hoopLeft.backboardH) {
      ball.vx = Math.abs(ball.vx) * 0.8;
      AudioEngine.rim();
    }
    // Right Backboard
    if (ball.x + currentBallType.radius > hoopRight.backboardX && ball.x - currentBallType.radius < hoopRight.backboardX + 10 &&
        ball.y > hoopRight.backboardY && ball.y < hoopRight.backboardY + hoopRight.backboardH) {
      ball.vx = -Math.abs(ball.vx) * 0.8;
      AudioEngine.rim();
    }

    // Rim Bounces & Goals
    // Left Rim (Red team attacks left rim to score!)
    const dRimLeft = Math.hypot(ball.x - hoopLeft.x, ball.y - hoopLeft.y);
    if (dRimLeft < currentBallType.radius + 8) {
      ball.vy = -ball.vy * 0.7;
      ball.vx += (ball.x - hoopLeft.x) * 0.2;
      AudioEngine.rim();
    }
    // Through Left Rim (Goal for Team 2 Red!)
    if (ball.vy > 0 && Math.abs(ball.x - hoopLeft.x) < hoopLeft.r && Math.abs(ball.y - hoopLeft.y) < 14 && !ball.scored) {
      ball.scored = true;
      goalScored(2);
      setTimeout(() => ball.scored = false, 1500);
    }

    // Right Rim (Blue team attacks right rim to score!)
    const dRimRight = Math.hypot(ball.x - hoopRight.x, ball.y - hoopRight.y);
    if (dRimRight < currentBallType.radius + 8) {
      ball.vy = -ball.vy * 0.7;
      ball.vx += (ball.x - hoopRight.x) * 0.2;
      AudioEngine.rim();
    }
    // Through Right Rim (Goal for Team 1 Blue!)
    if (ball.vy > 0 && Math.abs(ball.x - hoopRight.x) < hoopRight.r && Math.abs(ball.y - hoopRight.y) < 14 && !ball.scored) {
      ball.scored = true;
      goalScored(1);
      setTimeout(() => ball.scored = false, 1500);
    }
  }

  // Draw
  function draw() {
    // Sky / Wall Background
    const bg = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
    bg.addColorStop(0, currentCourt.bgGrad[0]);
    bg.addColorStop(1, currentCourt.bgGrad[1]);
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

    // Court Floor
    ctx.fillStyle = currentCourt.floorColor;
    ctx.fillRect(0, 450, GAME_WIDTH, 90);

    // Court Lines
    ctx.strokeStyle = currentCourt.floorLine;
    ctx.lineWidth = 4;
    // Midcourt line
    ctx.beginPath();
    ctx.moveTo(GAME_WIDTH / 2, 450);
    ctx.lineTo(GAME_WIDTH / 2, GAME_HEIGHT);
    ctx.stroke();

    // Hoops (Backboard + Rim + Net)
    drawHoop(hoopLeft, true);
    drawHoop(hoopRight, false);

    // Players
    for (let p of players) {
      p.draw();
    }

    // Ball
    ctx.save();
    ctx.translate(ball.x, ball.y);
    ctx.rotate(ball.rot);

    ctx.fillStyle = currentBallType.color;
    ctx.beginPath();
    ctx.arc(0, 0, currentBallType.radius, 0, Math.PI * 2);
    ctx.fill();

    // Basketball seams
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, currentBallType.radius, 0, Math.PI * 2);
    ctx.moveTo(-currentBallType.radius, 0); ctx.lineTo(currentBallType.radius, 0);
    ctx.moveTo(0, -currentBallType.radius); ctx.lineTo(0, currentBallType.radius);
    ctx.stroke();

    ctx.restore();
  }

  function drawHoop(h, isLeft) {
    // Pole
    ctx.fillStyle = '#64748b';
    ctx.fillRect(isLeft ? h.backboardX - 8 : h.backboardX + 8, h.backboardY + 20, 8, 250);

    // Backboard
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(h.backboardX, h.backboardY, 8, h.backboardH);
    ctx.strokeStyle = '#dc2626';
    ctx.lineWidth = 2;
    ctx.strokeRect(h.backboardX, h.backboardY + 30, 8, 40);

    // Orange Rim
    ctx.strokeStyle = '#ea580c';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(isLeft ? h.backboardX + 8 : h.backboardX, h.y);
    ctx.lineTo(isLeft ? h.x + h.r : h.x - h.r, h.y);
    ctx.stroke();

    // White Net
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    const rimStart = isLeft ? h.backboardX + 8 : h.backboardX;
    const rimEnd = isLeft ? h.x + h.r : h.x - h.r;
    ctx.moveTo(rimStart, h.y); ctx.lineTo((rimStart + rimEnd)/2, h.y + 35); ctx.lineTo(rimEnd, h.y);
    ctx.stroke();
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  loop();
})();
</script>
</body>
</html>
