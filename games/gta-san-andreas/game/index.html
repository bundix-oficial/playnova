<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GTA: San Andreas — 2D Demake</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Trebuchet MS', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  #canvas-container { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; background: #1a2417; }
  
  /* GTA HUD */
  #hud {
    position: absolute;
    top: 16px;
    right: 18px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
    pointer-events: none;
    font-weight: 900;
    text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
  }
  .hud-money {
    font-size: 28px;
    color: #4ade80;
    letter-spacing: 1px;
  }
  .hud-stats {
    display: flex;
    flex-direction: column;
    gap: 4px;
    align-items: flex-end;
  }
  .stat-bar-container {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .stat-label {
    font-size: 11px;
    color: #fff;
    text-transform: uppercase;
  }
  .stat-bar {
    width: 90px;
    height: 10px;
    background: rgba(0,0,0,0.7);
    border: 2px solid #000;
    border-radius: 2px;
    overflow: hidden;
  }
  .stat-fill-health { width: 100%; height: 100%; background: #ef4444; transition: width 0.15s; }
  .stat-fill-armor { width: 0%; height: 100%; background: #3b82f6; transition: width 0.15s; }
  
  .hud-stars {
    display: flex;
    gap: 3px;
    font-size: 20px;
    color: #4b5563;
  }
  .star-active {
    color: #f59e0b;
    filter: drop-shadow(0 0 4px #fbbf24);
    animation: pulseStar 0.8s infinite alternate;
  }
  @keyframes pulseStar {
    0% { transform: scale(1); }
    100% { transform: scale(1.18); }
  }

  .hud-weapon {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(0,0,0,0.65);
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .weapon-icon { font-size: 22px; }
  .weapon-name { color: #fff; font-size: 13px; font-weight: 700; }
  .weapon-ammo { color: #facc15; font-size: 13px; }

  /* Notification banner */
  #banner {
    position: absolute;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.85);
    color: #fbbf24;
    padding: 8px 24px;
    border-radius: 30px;
    border: 2px solid #f59e0b;
    font-size: 14px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 20;
  }

  /* Radio Station Overlay */
  #radio-banner {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(15, 23, 42, 0.9);
    color: #38bdf8;
    padding: 8px 22px;
    border-radius: 20px;
    border: 1px solid #0284c7;
    font-size: 13px;
    font-weight: 700;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* Help & Controls bar */
  #controls-hint {
    position: absolute;
    bottom: 12px;
    left: 14px;
    background: rgba(0,0,0,0.7);
    color: #e2e8f0;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 11px;
    pointer-events: none;
    line-height: 1.4;
  }
  #controls-hint kbd {
    background: #334155;
    padding: 1px 5px;
    border-radius: 3px;
    font-weight: bold;
    color: #fff;
  }

  /* Mobile touch controls */
  #touch-controls {
    position: absolute;
    inset: 0;
    pointer-events: none;
    display: none;
    z-index: 10;
  }
  .touch-btn {
    pointer-events: auto;
    position: absolute;
    background: rgba(255,255,255,0.18);
    border: 2px solid rgba(255,255,255,0.4);
    border-radius: 50%;
    color: #fff;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
    touch-action: none;
  }
  .touch-btn:active { background: rgba(255,255,255,0.45); }
  #btn-enter { bottom: 30px; right: 30px; width: 62px; height: 62px; font-size: 14px; background: rgba(34,197,94,0.3); border-color: #22c55e; }
  #btn-attack { bottom: 105px; right: 30px; width: 56px; height: 56px; font-size: 20px; background: rgba(239,68,68,0.3); border-color: #ef4444; }
  #btn-weapon { bottom: 30px; right: 105px; width: 52px; height: 52px; font-size: 18px; }
  #btn-horn { bottom: 105px; right: 105px; width: 52px; height: 52px; font-size: 16px; }

  /* Wasted Screen */
  #wasted-screen {
    position: absolute;
    inset: 0;
    background: rgba(185, 28, 28, 0.4);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    backdrop-filter: grayscale(80%) blur(3px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.8s ease;
    z-index: 50;
  }
  #wasted-title {
    font-size: 64px;
    font-weight: 900;
    color: #ef4444;
    text-shadow: 4px 4px 0 #000, 0 0 20px rgba(0,0,0,0.8);
    letter-spacing: 6px;
    text-transform: uppercase;
    font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
  }
  #wasted-sub {
    margin-top: 12px;
    color: #fff;
    font-size: 16px;
    font-weight: bold;
    text-shadow: 1px 1px 2px #000;
  }
</style>
</head>
<body>

<div id="canvas-container">
  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <div class="hud-money" id="hud-money">$00000350</div>
    <div class="hud-stats">
      <div class="stat-bar-container">
        <span class="stat-label">VIDA</span>
        <div class="stat-bar"><div class="stat-fill-health" id="bar-health"></div></div>
      </div>
      <div class="stat-bar-container">
        <span class="stat-label">COLETE</span>
        <div class="stat-bar"><div class="stat-fill-armor" id="bar-armor"></div></div>
      </div>
    </div>
    <div class="hud-stars" id="hud-stars">
      <span>★</span><span>★</span><span>★</span><span>★</span><span>★</span>
    </div>
    <div class="hud-weapon">
      <span class="weapon-icon" id="weap-icon">👊</span>
      <span class="weapon-name" id="weap-name">SOCO</span>
      <span class="weapon-ammo" id="weap-ammo">∞</span>
    </div>
  </div>

  <div id="banner"></div>
  <div id="radio-banner">📻 <span id="radio-station">Radio Los Santos</span></div>

  <div id="controls-hint">
    <kbd>WASD</kbd> ou <kbd>Setas</kbd>: Mover / Dirigir<br>
    <kbd>F</kbd> / <kbd>Enter</kbd>: Entrar / Sair do Carro<br>
    <kbd>Espaço</kbd> ou <kbd>Clique</kbd>: Bater / Atirar<br>
    <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd>: Trocar Arma · <kbd>H</kbd>: Buzina · <kbd>R</kbd>: Rádio
  </div>

  <div id="touch-controls">
    <button class="touch-btn" id="btn-enter">🚗 ENTRAR</button>
    <button class="touch-btn" id="btn-attack">💥</button>
    <button class="touch-btn" id="btn-weapon">🔫</button>
    <button class="touch-btn" id="btn-horn">📢</button>
  </div>

  <div id="wasted-screen">
    <div id="wasted-title">WASTED</div>
    <div id="wasted-sub">Você renascerá no Hospital de Los Santos...</div>
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  // Responsive Canvas Size
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Touch device check
  const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  if (isTouch) {
    document.getElementById('touch-controls').style.display = 'block';
  }

  // Audio Synth Engine (Web Audio)
  const AudioEngine = {
    ctx: null,
    init() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) this.ctx = new AudioCtx();
      }
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
    },
    playTone(freq, type, duration, vol = 0.2, slideTo = null) {
      if (!this.ctx) return;
      try {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        if (slideTo) {
          osc.frequency.exponentialRampToValueAtTime(slideTo, this.ctx.currentTime + duration);
        }
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
      } catch(e) {}
    },
    punch() {
      this.init();
      this.playTone(140, 'triangle', 0.12, 0.3, 40);
    },
    shootPistol() {
      this.init();
      this.playTone(600, 'sawtooth', 0.1, 0.3, 80);
      this.playTone(180, 'square', 0.15, 0.4, 30);
    },
    shootUzi() {
      this.init();
      this.playTone(750, 'sawtooth', 0.06, 0.25, 120);
    },
    shootShotgun() {
      this.init();
      this.playTone(400, 'sawtooth', 0.22, 0.5, 40);
      this.playTone(120, 'square', 0.3, 0.6, 20);
    },
    horn() {
      this.init();
      this.playTone(380, 'sawtooth', 0.25, 0.2);
      this.playTone(440, 'sawtooth', 0.25, 0.2);
    },
    siren() {
      this.init();
      this.playTone(600, 'sine', 0.4, 0.15, 900);
    },
    carDoor() {
      this.init();
      this.playTone(220, 'square', 0.08, 0.2, 80);
    },
    skid() {
      this.init();
      this.playTone(300, 'sawtooth', 0.08, 0.12, 220);
    },
    money() {
      this.init();
      this.playTone(987, 'sine', 0.08, 0.2);
      setTimeout(() => this.playTone(1318, 'sine', 0.12, 0.2), 80);
    },
    wasted() {
      this.init();
      this.playTone(150, 'sawtooth', 1.2, 0.5, 40);
    }
  };

  // Keyboard State
  const keys = {};
  window.addEventListener('keydown', e => {
    AudioEngine.init();
    keys[e.key.toLowerCase()] = true;
    keys[e.code] = true;

    if (e.key === '1') selectWeapon(0);
    if (e.key === '2') selectWeapon(1);
    if (e.key === '3') selectWeapon(2);
    if (e.key === '4') selectWeapon(3);
    if (e.key.toLowerCase() === 'f' || e.key === 'Enter') toggleCar();
    if (e.key.toLowerCase() === 'h') honk();
    if (e.key.toLowerCase() === 'r') changeRadio();
  });
  window.addEventListener('keyup', e => {
    keys[e.key.toLowerCase()] = false;
    keys[e.code] = false;
  });

  // Touch action buttons
  document.getElementById('btn-enter').addEventListener('click', () => { AudioEngine.init(); toggleCar(); });
  document.getElementById('btn-attack').addEventListener('click', () => { AudioEngine.init(); attack(); });
  document.getElementById('btn-weapon').addEventListener('click', () => { AudioEngine.init(); nextWeapon(); });
  document.getElementById('btn-horn').addEventListener('click', () => { AudioEngine.init(); honk(); });

  // Mouse aim & click attack
  let mouseX = 0, mouseY = 0;
  window.addEventListener('mousemove', e => {
    mouseX = e.clientX;
    mouseY = e.clientY;
  });
  window.addEventListener('mousedown', e => {
    if (e.target.tagName !== 'BUTTON') {
      AudioEngine.init();
      attack();
    }
  });

  // Radio Stations
  const RADIO_STATIONS = [
    'Radio Los Santos (Hip-Hop)',
    'K-DST (Classic Rock)',
    'Bounce FM (Funk & Groove)',
    'SF-UR (House & Electro)',
    'Radio Off'
  ];
  let currentRadio = 0;
  function changeRadio() {
    currentRadio = (currentRadio + 1) % RADIO_STATIONS.length;
    const banner = document.getElementById('radio-banner');
    document.getElementById('radio-station').textContent = RADIO_STATIONS[currentRadio];
    banner.style.opacity = '1';
    clearTimeout(banner._timer);
    banner._timer = setTimeout(() => banner.style.opacity = '0', 2500);
  }

  // Weapons
  const WEAPONS = [
    { name: 'SOCO', icon: '👊', ammo: Infinity, range: 45, damage: 25, type: 'melee' },
    { name: 'PISTOLA 9MM', icon: '🔫', ammo: 60, range: 350, damage: 35, type: 'gun' },
    { name: 'MICRO UZI', icon: '⚡', ammo: 150, range: 320, damage: 22, rate: 100, type: 'rapid' },
    { name: 'ESCOPETA', icon: '💥', ammo: 24, range: 240, damage: 70, type: 'shotgun' }
  ];
  let currentWeaponIdx = 0;

  function selectWeapon(idx) {
    if (idx >= 0 && idx < WEAPONS.length) {
      currentWeaponIdx = idx;
      updateWeaponHUD();
    }
  }
  function nextWeapon() {
    selectWeapon((currentWeaponIdx + 1) % WEAPONS.length);
  }

  function updateWeaponHUD() {
    const w = WEAPONS[currentWeaponIdx];
    document.getElementById('weap-icon').textContent = w.icon;
    document.getElementById('weap-name').textContent = w.name;
    document.getElementById('weap-ammo').textContent = w.ammo === Infinity ? '∞' : w.ammo;
  }

  // Banner Notification
  function showBanner(text) {
    const b = document.getElementById('banner');
    b.textContent = text;
    b.style.opacity = '1';
    clearTimeout(b._timer);
    b._timer = setTimeout(() => b.style.opacity = '0', 3000);
  }

  // World Constants
  const WORLD_WIDTH = 4200;
  const WORLD_HEIGHT = 4200;

  // City Map Grid (Streets, Blocks, Houses, Trees)
  const roads = [
    // Main Avenues (Horizontal)
    { x: 0, y: 700, w: WORLD_WIDTH, h: 160 },
    { x: 0, y: 1700, w: WORLD_WIDTH, h: 180 },
    { x: 0, y: 2700, w: WORLD_WIDTH, h: 160 },
    { x: 0, y: 3500, w: WORLD_WIDTH, h: 140 },

    // Main Avenues (Vertical)
    { x: 700, y: 0, w: 160, h: WORLD_HEIGHT },
    { x: 1700, y: 0, w: 180, h: WORLD_HEIGHT },
    { x: 2700, y: 0, w: 160, h: WORLD_HEIGHT },
    { x: 3500, y: 0, w: 140, h: WORLD_HEIGHT }
  ];

  // Buildings & Lots
  const buildings = [];
  function generateBuildings() {
    // Generate city blocks between the roads
    const blockRangesX = [[100, 600], [960, 1600], [1980, 2600], [2960, 3400], [3740, 4100]];
    const blockRangesY = [[100, 600], [960, 1600], [1980, 2600], [2960, 3400], [3740, 4100]];

    const colors = ['#475569', '#334155', '#64748b', '#78350f', '#854d0e', '#1e293b', '#374151', '#4b5563'];

    for (let bx of blockRangesX) {
      for (let by of blockRangesY) {
        // Divide block into 2-4 buildings
        const bW = bx[1] - bx[0];
        const bH = by[1] - by[0];
        const midX = bx[0] + bW / 2;
        const midY = by[0] + bH / 2;

        buildings.push({ x: bx[0] + 15, y: by[0] + 15, w: bW/2 - 25, h: bH/2 - 25, color: colors[Math.floor(Math.random()*colors.length)], name: 'Loja' });
        buildings.push({ x: midX + 10, y: by[0] + 15, w: bW/2 - 25, h: bH/2 - 25, color: colors[Math.floor(Math.random()*colors.length)], name: 'Casa' });
        buildings.push({ x: bx[0] + 15, y: midY + 10, w: bW/2 - 25, h: bH/2 - 25, color: colors[Math.floor(Math.random()*colors.length)], name: 'Prédio' });
        buildings.push({ x: midX + 10, y: midY + 10, w: bW/2 - 25, h: bH/2 - 25, color: colors[Math.floor(Math.random()*colors.length)], name: 'Garagem' });
      }
    }

    // Special landmark: CJ's House (Grove Street) at (2300, 2300)
    buildings.push({ x: 2280, y: 2240, w: 180, h: 140, color: '#166534', isCJHouse: true, name: "CJ's House (Grove St)" });

    // Special landmark: Hospital at (1200, 1200)
    buildings.push({ x: 1200, y: 1200, w: 220, h: 180, color: '#e2e8f0', isHospital: true, name: 'Hospital de Los Santos' });

    // Special landmark: Police Station at (1200, 2200)
    buildings.push({ x: 1200, y: 2200, w: 220, h: 180, color: '#1e3a8a', isPolice: true, name: 'Los Santos Police Dept' });
  }
  generateBuildings();

  // Palm Trees & Street Furniture
  const palmTrees = [];
  for (let i = 0; i < 90; i++) {
    palmTrees.push({
      x: 200 + Math.random() * (WORLD_WIDTH - 400),
      y: 200 + Math.random() * (WORLD_HEIGHT - 400)
    });
  }

  // Player (CJ)
  const player = {
    x: 2370,
    y: 2420,
    vx: 0,
    vy: 0,
    speed: 3.8,
    angle: 0,
    health: 100,
    armor: 50,
    money: 350,
    inCar: null,
    wanted: 0,
    wantedTimer: 0,
    wasted: false
  };

  // Skid Marks array (tires)
  const skidMarks = [];

  // Bullets
  const bullets = [];

  // Particles (Blood, smoke, sparks)
  const particles = [];

  // Money Pickups on ground
  const pickups = [];

  // Cars in Los Santos
  const CAR_TYPES = [
    { name: 'Greenwood', color: '#15803d', topSpeed: 7.2, accel: 0.18, turnSpeed: 0.05, w: 42, h: 78 },
    { name: 'Infernus', color: '#dc2626', topSpeed: 9.6, accel: 0.28, turnSpeed: 0.065, w: 40, h: 76 },
    { name: 'Police Cruiser', color: '#000000', isPolice: true, topSpeed: 8.5, accel: 0.22, turnSpeed: 0.055, w: 42, h: 80 },
    { name: 'Taxi', color: '#eab308', topSpeed: 7.5, accel: 0.2, turnSpeed: 0.05, w: 42, h: 78 },
    { name: 'Esperanto', color: '#9a3412', topSpeed: 6.8, accel: 0.16, turnSpeed: 0.045, w: 44, h: 82 }
  ];

  const cars = [];
  function spawnCar(x, y, angle, typeIdx, isAI = true) {
    const type = CAR_TYPES[typeIdx];
    cars.push({
      x, y,
      vx: 0, vy: 0,
      angle: angle,
      speed: 0,
      type: type,
      health: 100,
      isAI: isAI,
      aiTurnTimer: 0,
      sirenOn: false,
      flasher: 0
    });
  }

  // Spawn initial cars along roads
  for (let i = 0; i < 28; i++) {
    const road = roads[i % roads.length];
    const isH = road.w > road.h;
    const x = isH ? road.x + 100 + Math.random() * (road.w - 200) : road.x + road.w / 2;
    const y = isH ? road.y + road.h / 2 : road.y + 100 + Math.random() * (road.h - 200);
    const angle = isH ? (Math.random() > 0.5 ? 0 : Math.PI) : (Math.random() > 0.5 ? Math.PI/2 : -Math.PI/2);
    const tIdx = Math.floor(Math.random() * CAR_TYPES.length);
    spawnCar(x, y, angle, tIdx, true);
  }

  // Spawn CJ's starter car outside Grove Street house
  spawnCar(2390, 2450, 0, 0, false);

  // Pedestrians
  const peds = [];
  const PED_SKINS = ['#f87171', '#fb923c', '#fbbf24', '#a3e635', '#38bdf8', '#c084fc', '#f472b6'];

  function spawnPed(x, y) {
    peds.push({
      x, y,
      vx: 0, vy: 0,
      angle: Math.random() * Math.PI * 2,
      speed: 1.2,
      health: 40,
      shirt: PED_SKINS[Math.floor(Math.random() * PED_SKINS.length)],
      state: 'walk', // walk, flee, attack
      walkTimer: Math.random() * 120
    });
  }

  for (let i = 0; i < 45; i++) {
    spawnPed(
      300 + Math.random() * (WORLD_WIDTH - 600),
      300 + Math.random() * (WORLD_HEIGHT - 600)
    );
  }

  // Police Spawner when wanted > 0
  let policeSpawnTimer = 0;
  function handlePoliceSpawns() {
    if (player.wanted === 0 || player.wasted) return;
    policeSpawnTimer++;
    const spawnRate = Math.max(90, 360 - player.wanted * 50);

    if (policeSpawnTimer >= spawnRate) {
      policeSpawnTimer = 0;
      // Spawn police cruiser near player offscreen
      const dist = 700;
      const ang = Math.random() * Math.PI * 2;
      const px = player.x + Math.cos(ang) * dist;
      const py = player.y + Math.sin(ang) * dist;

      const pCar = {
        x: px, y: py,
        vx: 0, vy: 0,
        angle: ang + Math.PI,
        speed: 0,
        type: CAR_TYPES[2], // Police
        health: 120,
        isAI: true,
        isCop: true,
        sirenOn: true,
        flasher: 0
      };
      cars.push(pCar);
      AudioEngine.siren();
      showBanner(`🚨 POLÍCIA EM PERSEGUIÇÃO! (${player.wanted} ESTRELAS)`);
    }
  }

  // Toggle Enter / Exit Car
  function toggleCar() {
    if (player.wasted) return;

    if (player.inCar) {
      // Exit Car
      const car = player.inCar;
      player.x = car.x + Math.cos(car.angle + Math.PI/2) * 35;
      player.y = car.y + Math.sin(car.angle + Math.PI/2) * 35;
      player.inCar = null;
      car.isAI = false;
      AudioEngine.carDoor();
      showBanner('Você saiu do veículo');
    } else {
      // Find nearest car
      let nearest = null;
      let minDist = 70;
      for (let car of cars) {
        const d = Math.hypot(car.x - player.x, car.y - player.y);
        if (d < minDist) {
          minDist = d;
          nearest = car;
        }
      }
      if (nearest) {
        player.inCar = nearest;
        nearest.isAI = false;
        AudioEngine.carDoor();
        showBanner(`Entrou em: ${nearest.type.name}`);
        if (nearest.type.isPolice && player.wanted === 0) {
          player.wanted = 1;
          updateStarsHUD();
          showBanner('⭐ 1 ESTRELA: Roubou viatura policial!');
        }
      }
    }
  }

  // Honk Horn
  function honk() {
    if (player.inCar) {
      AudioEngine.horn();
      // Scare nearby peds
      for (let p of peds) {
        if (Math.hypot(p.x - player.inCar.x, p.y - player.inCar.y) < 200) {
          p.state = 'flee';
          p.angle = Math.atan2(p.y - player.inCar.y, p.x - player.inCar.x);
        }
      }
    }
  }

  // Attack Action (Punch or Shoot)
  let lastAttackTime = 0;
  function attack() {
    if (player.wasted || player.inCar) return;

    const now = Date.now();
    const w = WEAPONS[currentWeaponIdx];
    if (now - lastAttackTime < (w.rate || 220)) return;
    lastAttackTime = now;

    if (w.ammo <= 0 && w.ammo !== Infinity) {
      showBanner('Sem munição! Use os socos.');
      selectWeapon(0);
      return;
    }

    if (w.ammo !== Infinity) {
      w.ammo--;
      updateWeaponHUD();
    }

    // Aim angle towards mouse or facing direction
    const screenPx = canvas.width / 2;
    const screenPy = canvas.height / 2;
    const aimAngle = Math.atan2(mouseY - screenPy, mouseX - screenPx);
    player.angle = aimAngle;

    if (w.type === 'melee') {
      AudioEngine.punch();
      // Check hit on peds
      for (let p of peds) {
        const d = Math.hypot(p.x - player.x, p.y - player.y);
        if (d < w.range) {
          p.health -= w.damage;
          p.x += Math.cos(aimAngle) * 15;
          p.y += Math.sin(aimAngle) * 15;
          createSparks(p.x, p.y, '#dc2626', 6);
          p.state = 'flee';
          if (p.health <= 0) killPed(p);
          crimeReport(1);
          break;
        }
      }
    } else if (w.type === 'gun' || w.type === 'rapid') {
      if (w.type === 'gun') AudioEngine.shootPistol();
      else AudioEngine.shootUzi();

      bullets.push({
        x: player.x + Math.cos(aimAngle) * 20,
        y: player.y + Math.sin(aimAngle) * 20,
        vx: Math.cos(aimAngle) * 16,
        vy: Math.sin(aimAngle) * 16,
        damage: w.damage,
        life: 30,
        isPlayer: true
      });
      crimeReport(1);
    } else if (w.type === 'shotgun') {
      AudioEngine.shootShotgun();
      // Spread 5 pellets
      for (let s = -2; s <= 2; s++) {
        const spAngle = aimAngle + s * 0.08;
        bullets.push({
          x: player.x + Math.cos(aimAngle) * 20,
          y: player.y + Math.sin(aimAngle) * 20,
          vx: Math.cos(spAngle) * 15,
          vy: Math.sin(spAngle) * 15,
          damage: w.damage / 2,
          life: 20,
          isPlayer: true
        });
      }
      crimeReport(2);
    }
  }

  function crimeReport(severity = 1) {
    if (player.wanted < 5) {
      player.wanted = Math.min(5, player.wanted + severity);
      player.wantedTimer = 600; // 10 seconds without crime to start cooling down
      updateStarsHUD();
    }
  }

  function updateStarsHUD() {
    const starSpans = document.getElementById('hud-stars').children;
    for (let i = 0; i < 5; i++) {
      if (i < player.wanted) {
        starSpans[i].className = 'star-active';
      } else {
        starSpans[i].className = '';
      }
    }
  }

  function killPed(p) {
    createSparks(p.x, p.y, '#991b1b', 16);
    // Drop money
    pickups.push({
      x: p.x, y: p.y,
      type: 'money',
      val: Math.floor(20 + Math.random() * 60)
    });
    // Remove ped and respawn another far away
    const idx = peds.indexOf(p);
    if (idx > -1) peds.splice(idx, 1);
    spawnPed(player.x + (Math.random()-0.5)*1800, player.y + (Math.random()-0.5)*1800);
  }

  function createSparks(x, y, color, count = 8) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 1 + Math.random() * 4;
      particles.push({
        x, y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        color,
        life: 20 + Math.random() * 15,
        maxLife: 35,
        size: 2 + Math.random() * 3
      });
    }
  }

  // Wasted Sequence
  function triggerWasted() {
    if (player.wasted) return;
    player.wasted = true;
    player.health = 0;
    AudioEngine.wasted();
    document.getElementById('bar-health').style.width = '0%';
    const wScr = document.getElementById('wasted-screen');
    wScr.style.opacity = '1';

    setTimeout(() => {
      // Respawn at hospital
      player.x = 1310;
      player.y = 1390;
      player.health = 100;
      player.armor = 0;
      player.wanted = 0;
      player.inCar = null;
      updateStarsHUD();
      document.getElementById('bar-health').style.width = '100%';
      document.getElementById('bar-armor').style.width = '0%';
      wScr.style.opacity = '0';
      player.wasted = false;
      showBanner('Você recebeu alta do Hospital de Los Santos');
    }, 3500);
  }

  // Update Game Logic
  function update() {
    if (player.wasted) return;

    // Wanted level cooldown
    if (player.wanted > 0) {
      if (player.wantedTimer > 0) {
        player.wantedTimer--;
      } else {
        player.wanted--;
        player.wantedTimer = 400;
        updateStarsHUD();
        if (player.wanted === 0) showBanner('Você despistou a polícia!');
      }
    }

    handlePoliceSpawns();

    // Player On Foot
    if (!player.inCar) {
      let dx = 0, dy = 0;
      if (keys['w'] || keys['arrowup']) dy -= 1;
      if (keys['s'] || keys['arrowdown']) dy += 1;
      if (keys['a'] || keys['arrowleft']) dx -= 1;
      if (keys['d'] || keys['arrowright']) dx += 1;

      if (dx !== 0 || dy !== 0) {
        const len = Math.hypot(dx, dy);
        player.vx = (dx / len) * player.speed;
        player.vy = (dy / len) * player.speed;
        player.angle = Math.atan2(dy, dx);
      } else {
        player.vx *= 0.7;
        player.vy *= 0.7;
      }

      // Check collision with buildings
      const nextX = player.x + player.vx;
      const nextY = player.y + player.vy;
      let collideX = false, collideY = false;

      for (let b of buildings) {
        if (nextX > b.x - 12 && nextX < b.x + b.w + 12 && player.y > b.y - 12 && player.y < b.y + b.h + 12) collideX = true;
        if (player.x > b.x - 12 && player.x < b.x + b.w + 12 && nextY > b.y - 12 && nextY < b.y + b.h + 12) collideY = true;
      }

      if (!collideX) player.x = Math.max(40, Math.min(WORLD_WIDTH - 40, nextX));
      if (!collideY) player.y = Math.max(40, Math.min(WORLD_HEIGHT - 40, nextY));

    } else {
      // Player Inside Car Driving
      const car = player.inCar;
      const accel = car.type.accel;
      const topSpeed = car.type.topSpeed;
      const turnSpeed = car.type.turnSpeed;

      if (keys['w'] || keys['arrowup']) {
        car.speed = Math.min(topSpeed, car.speed + accel);
      } else if (keys['s'] || keys['arrowdown']) {
        car.speed = Math.max(-topSpeed * 0.4, car.speed - accel * 1.5);
      } else {
        car.speed *= 0.96;
      }

      // Steering
      if (Math.abs(car.speed) > 0.2) {
        const dir = car.speed > 0 ? 1 : -1;
        if (keys['a'] || keys['arrowleft']) car.angle -= turnSpeed * dir;
        if (keys['d'] || keys['arrowright']) car.angle += turnSpeed * dir;
      }

      // Skid marks when hard turning at speed
      if (Math.abs(car.speed) > 4 && (keys['a'] || keys['d'] || keys['arrowleft'] || keys['arrowright'])) {
        AudioEngine.skid();
        skidMarks.push({
          x: car.x,
          y: car.y,
          angle: car.angle,
          alpha: 0.6
        });
        if (skidMarks.length > 180) skidMarks.shift();
      }

      car.vx = Math.cos(car.angle) * car.speed;
      car.vy = Math.sin(car.angle) * car.speed;

      // Building collisions for car
      const nextCarX = car.x + car.vx;
      const nextCarY = car.y + car.vy;
      let hitBuilding = false;

      for (let b of buildings) {
        if (nextCarX > b.x - 22 && nextCarX < b.x + b.w + 22 && nextCarY > b.y - 22 && nextCarY < b.y + b.h + 22) {
          hitBuilding = true;
          break;
        }
      }

      if (hitBuilding) {
        car.speed = -car.speed * 0.4;
        createSparks(car.x, car.y, '#f59e0b', 8);
        AudioEngine.punch();
      } else {
        car.x = Math.max(50, Math.min(WORLD_WIDTH - 50, nextCarX));
        car.y = Math.max(50, Math.min(WORLD_HEIGHT - 50, nextCarY));
      }

      // Sync player with car position
      player.x = car.x;
      player.y = car.y;
      player.angle = car.angle;

      // Running over pedestrians
      if (Math.abs(car.speed) > 2.5) {
        for (let p of peds) {
          if (Math.hypot(p.x - car.x, p.y - car.y) < 32) {
            p.health = 0;
            killPed(p);
            crimeReport(2);
            showBanner('💥 ATROPELAMENTO! PROCURADO PELA POLÍCIA!');
          }
        }
      }
    }

    // AI Cars Update
    for (let car of cars) {
      if (car === player.inCar) continue;

      if (car.isCop) {
        // Police AI Pursuing Player
        const distToPlayer = Math.hypot(player.x - car.x, player.y - car.y);
        const targetAng = Math.atan2(player.y - car.y, player.x - car.x);
        // Angle lerp
        let diff = targetAng - car.angle;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        car.angle += Math.sign(diff) * Math.min(0.06, Math.abs(diff));
        car.speed = Math.min(car.type.topSpeed * 0.9, car.speed + 0.15);

        car.flasher = (car.flasher + 1) % 20;

        // Ram player
        if (distToPlayer < 45) {
          if (player.inCar) {
            player.inCar.speed *= 0.5;
            createSparks(car.x, car.y, '#f59e0b', 6);
          } else {
            // Hit player on foot
            player.health -= 25;
            document.getElementById('bar-health').style.width = player.health + '%';
            createSparks(player.x, player.y, '#dc2626', 10);
            if (player.health <= 0) triggerWasted();
          }
        }
      } else if (car.isAI) {
        // Civilian Cruise
        car.speed = 3.2;
        car.aiTurnTimer--;
        if (car.aiTurnTimer <= 0) {
          car.aiTurnTimer = 180 + Math.random() * 240;
          if (Math.random() < 0.25) car.angle += (Math.random() > 0.5 ? 1 : -1) * (Math.PI / 2);
        }
      }

      car.x += Math.cos(car.angle) * car.speed;
      car.y += Math.sin(car.angle) * car.speed;

      // Wrap world bounds
      if (car.x < 100) car.x = WORLD_WIDTH - 150;
      if (car.x > WORLD_WIDTH - 100) car.x = 150;
      if (car.y < 100) car.y = WORLD_HEIGHT - 150;
      if (car.y > WORLD_HEIGHT - 100) car.y = 150;
    }

    // AI Pedestrians Update
    for (let p of peds) {
      if (p.state === 'flee') {
        p.speed = 3.0;
        p.walkTimer--;
        if (p.walkTimer <= 0) p.state = 'walk';
      } else {
        p.speed = 1.1;
        p.walkTimer--;
        if (p.walkTimer <= 0) {
          p.walkTimer = 90 + Math.random() * 150;
          p.angle += (Math.random() - 0.5) * 1.5;
        }
      }
      p.x += Math.cos(p.angle) * p.speed;
      p.y += Math.sin(p.angle) * p.speed;

      // Keep peds inside world
      p.x = Math.max(50, Math.min(WORLD_WIDTH - 50, p.x));
      p.y = Math.max(50, Math.min(WORLD_HEIGHT - 50, p.y));
    }

    // Bullets Update
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.vx;
      b.y += b.vy;
      b.life--;

      // Hit buildings
      let hit = false;
      for (let bd of buildings) {
        if (b.x > bd.x && b.x < bd.x + bd.w && b.y > bd.y && b.y < bd.y + bd.h) {
          hit = true;
          createSparks(b.x, b.y, '#94a3b8', 4);
          break;
        }
      }

      // Hit peds
      if (!hit && b.isPlayer) {
        for (let p of peds) {
          if (Math.hypot(p.x - b.x, p.y - b.y) < 18) {
            p.health -= b.damage;
            hit = true;
            createSparks(p.x, p.y, '#dc2626', 8);
            p.state = 'flee';
            if (p.health <= 0) killPed(p);
            crimeReport(1);
            break;
          }
        }
      }

      if (hit || b.life <= 0) {
        bullets.splice(i, 1);
      }
    }

    // Pickups (Money)
    for (let i = pickups.length - 1; i >= 0; i--) {
      const pk = pickups[i];
      if (Math.hypot(player.x - pk.x, player.y - pk.y) < 35) {
        player.money += pk.val;
        AudioEngine.money();
        document.getElementById('hud-money').textContent = '$' + String(player.money).padStart(8, '0');
        showBanner(`+$${pk.val} DÓLARES COLETADOS!`);
        pickups.splice(i, 1);
      }
    }

    // Particles Update
    for (let i = particles.length - 1; i >= 0; i--) {
      const pt = particles[i];
      pt.x += pt.vx;
      pt.y += pt.vy;
      pt.vx *= 0.95;
      pt.vy *= 0.95;
      pt.life--;
      if (pt.life <= 0) particles.splice(i, 1);
    }
  }

  // Render Game Scene
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Camera centered on Player
    const camX = canvas.width / 2 - player.x;
    const camY = canvas.height / 2 - player.y;

    ctx.save();
    ctx.translate(camX, camY);

    // Draw Ground (Grass / Dirt)
    ctx.fillStyle = '#1e301b';
    ctx.fillRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);

    // Draw Roads (Asphalt + Yellow Lines)
    for (let r of roads) {
      // Asphalt
      ctx.fillStyle = '#262626';
      ctx.fillRect(r.x, r.y, r.w, r.h);

      // Sidewalk curbs
      ctx.fillStyle = '#64748b';
      if (r.w > r.h) {
        // Horizontal road curbs
        ctx.fillRect(r.x, r.y - 8, r.w, 8);
        ctx.fillRect(r.x, r.y + r.h, r.w, 8);
        // Yellow center dashes
        ctx.strokeStyle = '#eab308';
        ctx.lineWidth = 4;
        ctx.setLineDash([24, 18]);
        ctx.beginPath();
        ctx.moveTo(r.x, r.y + r.h / 2);
        ctx.lineTo(r.x + r.w, r.y + r.h / 2);
        ctx.stroke();
        ctx.setLineDash([]);
      } else {
        // Vertical road curbs
        ctx.fillRect(r.x - 8, r.y, 8, r.h);
        ctx.fillRect(r.x + r.w, r.y, 8, r.h);
        // Yellow center dashes
        ctx.strokeStyle = '#eab308';
        ctx.lineWidth = 4;
        ctx.setLineDash([24, 18]);
        ctx.beginPath();
        ctx.moveTo(r.x + r.w / 2, r.y);
        ctx.lineTo(r.x + r.w / 2, r.y + r.h);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    // Draw Skid Marks
    for (let sm of skidMarks) {
      ctx.save();
      ctx.translate(sm.x, sm.y);
      ctx.rotate(sm.angle);
      ctx.fillStyle = `rgba(10, 10, 10, ${sm.alpha})`;
      ctx.fillRect(-15, -12, 10, 4);
      ctx.fillRect(-15, 8, 10, 4);
      ctx.restore();
      sm.alpha *= 0.998;
    }

    // Draw Pickups (Money Cash stacks)
    for (let pk of pickups) {
      ctx.fillStyle = '#16a34a';
      ctx.fillRect(pk.x - 8, pk.y - 6, 16, 12);
      ctx.fillStyle = '#4ade80';
      ctx.fillRect(pk.x - 6, pk.y - 4, 12, 8);
      ctx.fillStyle = '#052e16';
      ctx.font = 'bold 8px monospace';
      ctx.fillText('$', pk.x - 3, pk.y + 3);
    }

    // Draw Buildings with 3D drop-shadow effect
    for (let b of buildings) {
      // Building drop shadow
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fillRect(b.x + 12, b.y + 16, b.w, b.h);

      // Main roof
      ctx.fillStyle = b.color;
      ctx.fillRect(b.x, b.y, b.w, b.h);

      // Border trim
      ctx.strokeStyle = 'rgba(255,255,255,0.18)';
      ctx.lineWidth = 4;
      ctx.strokeRect(b.x, b.y, b.w, b.h);

      // Building name badge
      if (b.isCJHouse || b.isHospital || b.isPolice) {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(b.name, b.x + b.w / 2, b.y + b.h / 2);
      }
    }

    // Draw Palm Trees
    for (let pt of palmTrees) {
      // Tree shadow
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath();
      ctx.arc(pt.x + 14, pt.y + 14, 18, 0, Math.PI * 2);
      ctx.fill();

      // Trunk
      ctx.fillStyle = '#78350f';
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, 5, 0, Math.PI * 2);
      ctx.fill();

      // Green fronds
      ctx.fillStyle = '#15803d';
      for (let a = 0; a < Math.PI * 2; a += Math.PI / 3) {
        ctx.beginPath();
        ctx.ellipse(pt.x + Math.cos(a) * 14, pt.y + Math.sin(a) * 14, 14, 6, a, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Draw Pedestrians
    for (let p of peds) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.angle);

      // Shadow
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath();
      ctx.arc(2, 2, 8, 0, Math.PI * 2);
      ctx.fill();

      // Body / Shoulders
      ctx.fillStyle = p.shirt;
      ctx.beginPath();
      ctx.ellipse(0, 0, 7, 10, 0, 0, Math.PI * 2);
      ctx.fill();

      // Head
      ctx.fillStyle = '#fbcfe8';
      ctx.beginPath();
      ctx.arc(0, 0, 5, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // Draw Cars
    for (let car of cars) {
      ctx.save();
      ctx.translate(car.x, car.y);
      ctx.rotate(car.angle);

      // Drop shadow
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(-car.type.w/2 + 6, -car.type.h/2 + 6, car.type.w, car.type.h);

      // Car Chassis
      ctx.fillStyle = car.type.color;
      ctx.beginPath();
      ctx.roundRect(-car.type.w/2, -car.type.h/2, car.type.w, car.type.h, 6);
      ctx.fill();

      // Windshield & Rear glass
      ctx.fillStyle = '#0f172a';
      // Front windshield
      ctx.fillRect(-car.type.w/2 + 4, 6, car.type.w - 8, 14);
      // Rear windshield
      ctx.fillRect(-car.type.w/2 + 4, -car.type.h/2 + 8, car.type.w - 8, 10);
      // Roof
      ctx.fillStyle = car.type.color;
      ctx.fillRect(-car.type.w/2 + 4, -car.type.h/2 + 18, car.type.w - 8, 22);

      // Headlights
      ctx.fillStyle = '#fef08a';
      ctx.fillRect(-car.type.w/2 + 3, car.type.h/2 - 3, 7, 3);
      ctx.fillRect(car.type.w/2 - 10, car.type.h/2 - 3, 7, 3);

      // Taillights
      ctx.fillStyle = '#dc2626';
      ctx.fillRect(-car.type.w/2 + 3, -car.type.h/2, 7, 3);
      ctx.fillRect(car.type.w/2 - 10, -car.type.h/2, 7, 3);

      // Police Lightbar (Flashing Red / Blue)
      if (car.type.isPolice) {
        const isRed = car.flasher < 10;
        ctx.fillStyle = isRed ? '#ef4444' : '#3b82f6';
        ctx.fillRect(-12, -4, 11, 8);
        ctx.fillStyle = isRed ? '#3b82f6' : '#ef4444';
        ctx.fillRect(1, -4, 11, 8);

        // Flashing light glow on ground
        if (car.sirenOn) {
          ctx.fillStyle = isRed ? 'rgba(239, 68, 68, 0.2)' : 'rgba(59, 130, 246, 0.2)';
          ctx.beginPath();
          ctx.arc(0, 0, 70, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      ctx.restore();
    }

    // Draw Player (CJ) on foot
    if (!player.inCar && !player.wasted) {
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.rotate(player.angle);

      // Shadow
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.beginPath();
      ctx.arc(3, 3, 10, 0, Math.PI * 2);
      ctx.fill();

      // White Tank Top (Iconic CJ style)
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(0, 0, 9, 12, 0, 0, Math.PI * 2);
      ctx.fill();

      // Blue Jeans Legs
      ctx.fillStyle = '#1d4ed8';
      ctx.fillRect(-7, -4, 5, 8);
      ctx.fillRect(2, -4, 5, 8);

      // Arms (holding weapon or fists)
      ctx.fillStyle = '#78350f'; // Skin tone
      ctx.beginPath();
      ctx.arc(9, 6, 3.5, 0, Math.PI * 2);
      ctx.arc(9, -6, 3.5, 0, Math.PI * 2);
      ctx.fill();

      // Gun model in hands if armed
      if (currentWeaponIdx > 0) {
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(8, -2, 10, 4);
      }

      // Head
      ctx.fillStyle = '#78350f';
      ctx.beginPath();
      ctx.arc(0, 0, 6, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // Draw Bullets
    ctx.fillStyle = '#facc15';
    for (let b of bullets) {
      ctx.beginPath();
      ctx.arc(b.x, b.y, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }

    // Draw Particles
    for (let pt of particles) {
      ctx.fillStyle = pt.color;
      ctx.globalAlpha = pt.life / pt.maxLife;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1.0;

    ctx.restore();

    // Mini Map (Top Left Radar)
    drawMiniMap();
  }

  // GTA Iconic Circular Radar (Mini-Map)
  function drawMiniMap() {
    const mapSize = 130;
    const mapX = 20;
    const mapY = 20;

    ctx.save();
    // Clip circle
    ctx.beginPath();
    ctx.arc(mapX + mapSize/2, mapY + mapSize/2, mapSize/2, 0, Math.PI * 2);
    ctx.fillStyle = '#0f172a';
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#475569';
    ctx.stroke();
    ctx.clip();

    // Draw scaled world onto mini-map
    const scale = mapSize / 1500;
    ctx.translate(mapX + mapSize/2, mapY + mapSize/2);
    ctx.scale(scale, scale);
    ctx.translate(-player.x, -player.y);

    // Mini Roads
    ctx.fillStyle = '#475569';
    for (let r of roads) {
      ctx.fillRect(r.x, r.y, r.w, r.h);
    }

    // Mini Buildings
    ctx.fillStyle = '#334155';
    for (let b of buildings) {
      ctx.fillRect(b.x, b.y, b.w, b.h);
    }

    // Mini Police icons (blinking red/blue dots)
    for (let c of cars) {
      if (c.type.isPolice) {
        ctx.fillStyle = c.flasher < 10 ? '#ef4444' : '#3b82f6';
        ctx.beginPath();
        ctx.arc(c.x, c.y, 16, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Player position marker (yellow triangle)
    ctx.restore();

    ctx.save();
    ctx.translate(mapX + mapSize/2, mapY + mapSize/2);
    ctx.rotate(player.angle);
    ctx.fillStyle = '#facc15';
    ctx.beginPath();
    ctx.moveTo(10, 0);
    ctx.lineTo(-7, -6);
    ctx.lineTo(-4, 0);
    ctx.lineTo(-7, 6);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // Main Loop
  function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
  }

  // Welcome Announcement
  setTimeout(() => {
    showBanner('BEM-VINDO A LOS SANTOS! PRESSIONE F PARA ENTRAR NO CARRO');
  }, 1000);

  gameLoop();
})();
</script>
